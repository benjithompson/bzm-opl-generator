# crane-hook (github.com/Blazemeter/crane-hook): a one-shot Pod that checks the
# cluster against what the agent needs and exits 0 or 1. Its Role is read-only
# and separate from the agent's.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: { namespace: ${NAMESPACE}, name: ${HOOK_ROLE} }
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [rolebindings, roles]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets, namespaces, pods, nodes, services, endpoints, configmaps]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: ["networking.istio.io"]
    resources: [virtualservices, destinationrules, gateways, serviceentries]
    verbs: [get, list]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { namespace: ${NAMESPACE}, name: ${HOOK_ROLE}-binding }
subjects:
  - kind: ServiceAccount
    name: ${SERVICE_ACCOUNT}
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: ${HOOK_ROLE}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata: { namespace: ${NAMESPACE}, name: cranehook }
spec:
  serviceAccountName: ${SERVICE_ACCOUNT}
  automountServiceAccountToken: true
  # Runs once; a failed check is reported by the exit code, not retried.
  restartPolicy: "Never"
  # As crane's own pod: restricted Pod Security admission accepts it.
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: cranehook-ctr
      image: ${HOOK_IMAGE}
      imagePullPolicy: "Always"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
${HOOK_UID_BLOCK}      env:
        - name: WORKING_NAMESPACE
          value: ${NAMESPACE}
        - name: ROLE_NAME
          value: ${HOOK_ROLE}
        - name: ROLE_BINDING_NAME
          value: ${HOOK_ROLE}-binding
        - name: SERVICE_ACCOUNT_NAME
          value: ${SERVICE_ACCOUNT}
        - name: DOCKER_REGISTRY
          value: ${REGISTRY}
${HOOK_SV_ENV}      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 200m, memory: 512Mi }
      volumeMounts:
        - name: testhook-tmp
          mountPath: /tmp/testhook
  volumes:
    - name: testhook-tmp
      emptyDir: {}
