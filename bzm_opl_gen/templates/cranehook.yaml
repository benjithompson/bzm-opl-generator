# crane-hook -- github.com/Blazemeter/crane-hook. A one-shot Pod that checks the
# cluster against what an agent needs (node capacity, egress to BlazeMeter and
# the registries, the RBAC below, and for service virtualization the ingress and
# its TLS secret) and exits 0 or 1.
#
# Upstream ships this as `kubernetes/cranehook.yaml` with `default` in every
# namespace field and placeholders for the rest; here every one of those values
# is something the bundle already decided, so they are substituted rather than
# left for a reader to fill in twice and get wrong once.
#
# Its Role is its own and is read-only -- it is not the agent's Role and grants
# the agent nothing. Both are namespaced, like everything else here.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: { namespace: ${NAMESPACE}, name: ${HOOK_ROLE} }
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [rolebindings, roles]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets, namespaces, pods, nodes, services, endpoints, configmaps]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list]
  # Read-only, and present whether or not istio is the configured backend: the
  # check is "is the ingress you asked for actually there", which it cannot
  # answer about a resource it may not list.
  - apiGroups: ["networking.istio.io"]
    resources: [virtualservices, destinationrules, gateways, serviceentries]
    verbs: [get, list]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: { namespace: ${NAMESPACE}, name: ${HOOK_ROLE}-binding }
subjects:
  - kind: ServiceAccount
    name: ${SERVICE_ACCOUNT}
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: ${HOOK_ROLE}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata: { namespace: ${NAMESPACE}, name: cranehook }
spec:
  serviceAccountName: ${SERVICE_ACCOUNT}
  automountServiceAccountToken: true
  # It runs once and stops. Never, not OnFailure: a failed check is the answer,
  # and restarting it would turn a red exit code into a CrashLoopBackOff that
  # reads like the check itself is broken.
  restartPolicy: "Never"
  containers:
    - name: cranehook-ctr
      image: ${HOOK_IMAGE}
      imagePullPolicy: "Always"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
${HOOK_UID_BLOCK}      env:
        - name: WORKING_NAMESPACE
          value: ${NAMESPACE}
        - name: ROLE_NAME
          value: ${HOOK_ROLE}
        - name: ROLE_BINDING_NAME
          value: ${HOOK_ROLE}-binding
        - name: SERVICE_ACCOUNT_NAME
          value: ${SERVICE_ACCOUNT}
        - name: DOCKER_REGISTRY
          value: ${REGISTRY}
${HOOK_SV_ENV}      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 200m, memory: 512Mi }
      volumeMounts:
        - name: testhook-tmp
          mountPath: /tmp/testhook
  volumes:
    - name: testhook-tmp
      emptyDir: {}
