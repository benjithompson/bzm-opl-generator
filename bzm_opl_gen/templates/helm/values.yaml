# BlazeMeter private location agent.
#
# harborId, shipId and authToken are required. Keep authToken out of git: pass
# it with --set-string, or name a Secret you create in existingSecret.

# -- Account (required) -------------------------------------------------------

# Private location id (BlazeMeter -> Settings -> Private Locations).
harborId: ""
# Agent id within that location.
shipId: ""
# The agent's AUTH_TOKEN. Leave empty when existingSecret holds it.
authToken: ""

# -- Platform -----------------------------------------------------------------

# k8s | openshift. On openshift the SCC assigns the UID and runAsUser is unused.
platform: k8s

# Engines inherit crane's UID:GID and drop all capabilities, so they pass
# restricted PodSecurity, OpenShift's restricted-v2 SCC and GKE Autopilot.
# Set false only for an engine image that needs a capability.
restrictEngines: true

# CLUSTERIP | NODEPORT. Both work with the namespaced Role; neither needs
# clusterRbac.
serviceType: CLUSTERIP

# -- Credentials --------------------------------------------------------------

# true:  AUTH_TOKEN goes in a Secret this chart creates (blazemeter-secret).
# false: AUTH_TOKEN goes in the ConfigMap, readable by anyone who can read
#        ConfigMaps.
useSecret: true

# A Secret you manage that holds AUTH_TOKEN (and optionally HTTP_PROXY /
# HTTPS_PROXY). The chart then creates no Secret. Requires useSecret: true.
existingSecret: ""

# -- Images -------------------------------------------------------------------

image:
  # Empty: <privateRegistry>/crane, or BlazeMeter's public registry.
  repository: ""
  # Pin for a reproducible install; a generated values file pins it for you.
  tag: latest
  pullPolicy: Always
  # A docker-registry Secret in this namespace, for pulling the crane image.
  pullSecret: ""

# Registry the agent pulls every BlazeMeter image from. Empty: BlazeMeter's
# public registry.
privateRegistry: ""

# crane-hook, a cluster-readiness check run by `helm test <release>`. It adds a
# Pod plus its own read-only Role and RoleBinding. Nothing runs it at install.
craneHook:
  enabled: false

# Required with privateRegistry: crane's image keys mapped to references in your
# registry. Generate it with bzm-opl-gen, which also writes the mirror script
# that pushes the images to exactly these references.
imageOverrides: {}
  # taurus-cloud:latest: registry.example.com/blazemeter/v4:2.4.454-reduced
  # apm-image:latest: registry.example.com/blazemeter/apm:1.7.112

# Adds commented DOCKER_REGISTRY_USERNAME/PASSWORD lines to the ConfigMap for
# engine image pulls. Prefer image.pullSecret and a cluster pull secret.
registryAuth: false

# Whether crane updates itself when BlazeMeter releases a new agent. Unset is
# false. When true, crane rewrites its own Deployment and later `helm upgrade`
# runs fail on a field-ownership conflict, so changes need uninstall + install.
# When false, keep the agent current yourself (bump image.tag and upgrade).
autoUpdate:

# -- RBAC ---------------------------------------------------------------------

# Read access to nodes, cluster-wide. Optional: crane uses it for capacity
# awareness and logs a "forbidden: nodes" warning without it.
clusterRbac: false

# The account crane runs as. The name is used whether or not the chart creates
# the account; with create: false it is required and must already exist.
serviceAccount:
  create: true
  # Empty: the chart's fullname (default "crane").
  name: ""
  annotations: {}

# -- Crane pod ----------------------------------------------------------------

# k8s only; ignored on openshift.
runAsUser: 1337

# Placement of the crane pod.
nodeSelector: {}
tolerations: []

# Placement of the engine pods crane starts. Independent of the pair above:
# empty places engines on any node. See nodepools.md for a dedicated pool.
engineNodeSelector: {}
engineTolerations: []

podAnnotations: {}
podLabels: {}

# Crane's own pod. An existing LimitRange max must allow these.
crane:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
      # Keep equal to the request: GKE Autopilot lowers the limit to it.
      ephemeral-storage: 1Gi

probes:
  enabled: true
  liveness:
    # Crane starts slowly; a shorter delay causes restart loops.
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

# -- Engines ------------------------------------------------------------------

# Limits crane sets on each engine pod. Empty: 2 CPU / 8Gi. Each concurrent
# engine also needs about 60GB of disk (40GB of it /tmp).
#
# Engine requests are not set here: they come from the location's
# overrideCPU/overrideMemory (Settings -> Private Locations), default
# 250m/256Mi. Set those to match these limits.
engine:
  cpuLimit: ""
  memoryLimit: ""
  # Integer MB.
  ephemeralRequestMb: ""
  ephemeralLimitMb: ""

# -- Service virtualization ---------------------------------------------------

# How crane publishes virtual services. Empty: performance only.
#
#   nginx      an Ingress (networking.k8s.io)
#   istio      a Gateway + VirtualService (networking.istio.io)
#   contour    an HTTPProxy (projectcontour.io)
#   openshift  a Route (route.openshift.io); requires platform: openshift
#
# istio and contour require serviceType: CLUSTERIP. A location that serves
# virtual services needs this set, or they stall at WAITING_FOR_DOMAIN.
sv:
  ingress: ""
  # Wildcard domain served by your ingress controller. Endpoints are
  # <virtual-service>-<port>-<namespace>.<subdomain>, so *.<subdomain> needs a
  # DNS record pointing at the controller.
  subdomain: ""
  # A TLS Secret in this namespace, covering *.<subdomain>. The name is always
  # required; nginx and contour read the Secret, istio and openshift do not.
  # Create it yourself:
  #   kubectl -n <namespace> create secret tls <name> --cert=<file> --key=<file>
  tlsSecret: ""
  # istio only. Empty: crane creates a Gateway per virtual service.
  istioGateway: ""

# -- Additional agent environment ---------------------------------------------

# Agent variables with no dedicated value above. They reach the crane pod, not
# the engines. Do not repeat a variable this chart already sets.
#
#   extraEnv:
#     PREFERRED_INTERFACE: eth1
#     KUBERNETES_USE_PRE_PULLING: "true"
extraEnv: {}

# -- Proxy --------------------------------------------------------------------

# Credentials go in the URL (http://user:pass@host:port); such a URL is stored
# in the Secret when useSecret is true. JMeter ignores HTTP(S)_PROXY for test
# traffic, so set the proxy in the test itself as well.
proxy:
  enabled: false
  http: ""
  https: ""
  # Needed for the agent to reach the API server and itself.
  noProxy: "kubernetes.default,127.0.0.1,localhost"

# -- Corporate CA trust -------------------------------------------------------

# mode, one of:
#   none             no custom trust
#   inline           a ConfigMap this chart creates from caBundle.file or pem
#   existing         a ConfigMap you already manage (for example trust-manager)
#   openshiftInject  an empty ConfigMap OpenShift fills with the cluster bundle
caBundle:
  mode: none
  pem: ""
  # Certificate file name, placed beside Chart.yaml (helm reads files only from
  # the chart directory). pem wins if both are set. Alternatively:
  #   --set-file caBundle.pem=/path/to/ca.crt
  file: ""
  existingConfigMap: ""
  key: ca-bundle.crt
  # Mount path in the crane pod; engines receive the same bundle automatically.
  mountPath: /var/cm

# -- Naming -------------------------------------------------------------------

# Defaults match the object names of the generated manifests.
nameOverride: ""
fullnameOverride: ""
