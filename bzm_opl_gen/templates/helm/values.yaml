# BlazeMeter private location agent -- performance testing only.
#
# The three account facts at the top are the only required values. Get them with
#   bzm-opl-gen locations --api-key api-key.json --account-name "<ACCOUNT>"
# and keep authToken out of git (--set-string, or a Secret you create yourself
# and name in existingSecret).

# -- Account facts (required) -------------------------------------------------

# Private location id.
harborId: ""
# Agent id within the location. A location with several agents needs the id of
# the one this deployment is.
shipId: ""
# Token generated for the private location in the BlazeMeter UI. Leave empty and
# set existingSecret if a Secret already holds it.
authToken: ""

# -- Platform -----------------------------------------------------------------

# k8s | openshift. On openshift the restricted-v2 SCC assigns the UID, so
# runAsUser is left unset. What engines inherit differs by platform; whether
# they drop privileges is restrictEngines below, on either.
platform: k8s

# Engines crane spawns inherit its UID:GID and drop all capabilities, so they
# pass restricted PodSecurity, OpenShift's restricted-v2 SCC and GKE Autopilot's
# Warden. Crane's own default is a privileged engine pod, which all three refuse
# -- and refuse late, after the agent is already online and the location looks
# ready, so the run hangs at BOOT_STARTING rather than failing usefully. Set
# false only for an image that genuinely needs a capability.
restrictEngines: true

# CLUSTERIP | NODEPORT. Either runs on the namespaced Role this chart creates:
# crane takes its advertised address from its own network interfaces, not from
# the Node object, and creates the NodePort Service through the same `services`
# rule it uses for everything else. So NODEPORT does not need clusterRbac below
# -- verified on a live performance location with no ClusterRole in the cluster
# at all. CLUSTERIP stays the default because it is the smaller ask of a
# cluster, not because NODEPORT costs permissions.
serviceType: CLUSTERIP

# -- Credentials --------------------------------------------------------------

# true  -> AUTH_TOKEN goes in a Secret this chart creates (blazemeter-secret).
# false -> AUTH_TOKEN goes in the ConfigMap in plain text. Simpler to eyeball,
#          readable by anyone who can read ConfigMaps.
useSecret: true

# Name of a Secret you manage that already carries AUTH_TOKEN (and optionally
# HTTP_PROXY/HTTPS_PROXY). Set this and the chart creates no Secret of its own;
# authToken is then unused. Requires useSecret: true.
existingSecret: ""

# -- Images -------------------------------------------------------------------

image:
  # Empty -> derived: privateRegistry/crane when privateRegistry is set,
  # otherwise BlazeMeter's public registry.
  repository: ""
  # `bzm-opl-gen generate` pins the tag the account actually advertises for this
  # location; a chart has no API access and cannot, so this floats. Pin it for a
  # reproducible install -- read the exact tag off the generated manifests, or
  # from admin/ship-stats in the BlazeMeter UI.
  tag: latest
  pullPolicy: Always
  # Name of a docker-registry Secret in this namespace, for the crane image
  # pull. Engine image pulls are crane's own business -- see registryAuth.
  pullSecret: ""

# Registry the agent pulls every BlazeMeter image from. Empty -> BlazeMeter's
# public registry. Upgrading an air-gapped location is re-mirror + bump tags,
# not a silent pull -- autoUpdate below is off by default, which is what a
# sealed cluster wants anyway; it no longer keys off this value.
privateRegistry: ""

# github.com/Blazemeter/crane-hook -- a one-shot Pod, plus its own read-only
# Role and RoleBinding, that checks the cluster against what the agent needs and
# exits 0 or 1. Off by default: it is a check, not part of the agent. On, it is
# the chart's `helm test` hook, so `helm test <release>` runs it and nothing
# runs it at install time.
craneHook:
  enabled: false

# Only read when privateRegistry is set. Maps BlazeMeter's image keys to the
# refs in your registry -- a missing key silently falls back to the public
# registry, so it has to be complete. Generate the exact map for this location:
#   bzm-opl-gen generate --api-key api-key.json --harbor-id <id> \
#       --private-registry <registry> --out out
# then copy IMAGE_OVERRIDES out of out/bzm_configmap.yaml. The generator reads
# the account's live agent inventory; a hand-written map goes stale.
imageOverrides: {}
  # The value is the reference crane composes: your registry, then the image's
  # whole path below BlazeMeter's public project, then the tag. Crane builds an
  # engine's reference that way and does not read this map for it, so a path
  # reduced to its last segment is an ImagePullBackOff on the first test.
  # The key is crane's own name for the image, which is not always the repo
  # (taurus-cloud lives at blazemeter/v4).
  # taurus-cloud:latest: registry.example.com/blazemeter/v4:2.4.454-reduced
  # apm-image:latest: registry.example.com/blazemeter/apm:1.7.112

# Emit commented DOCKER_REGISTRY_USERNAME/PASSWORD placeholders in the ConfigMap
# for crane-side engine image pulls. Fill them in, or use image.pullSecret and a
# cluster pull secret instead -- do not put a real password in a ConfigMap.
registryAuth: false

# Does crane update itself when BlazeMeter ships a newer agent? Unset is FALSE,
# unlike BlazeMeter's own Kubernetes manifest, which ships it on.
#
# The reason is that on breaks this chart's own upgrade path. Crane takes
# ownership of its Deployment within seconds of install (field manager
# "OpenAPI-Generator"): it rewrites the container image to whatever version
# BlazeMeter currently ships, and `.spec.strategy` from Recreate to
# RollingUpdate. Helm applies server-side, so the next `helm upgrade` fails on a
# field-ownership conflict having already applied the ConfigMap.
#
# --force-conflicts does not rescue that: the chart never declares
# `strategy.rollingUpdate`, so crane's copy survives beside the forced
# `type: Recreate` and the API server rejects the pair. With auto-update on,
# changing anything means uninstall + install. Verified on a live cluster.
#
# The tradeoff for the default: the agent does not upgrade itself, so keeping it
# current is your job -- re-generate, or bump image.tag and upgrade -- and one
# that falls far enough behind loses support. Set true to hand that back to
# crane, knowing upgrades become uninstall + install.
autoUpdate:

# -- RBAC ---------------------------------------------------------------------

# Cluster-scoped node reads. Nothing this chart renders requires them: crane
# uses them for capacity awareness only, and without them it logs a
# "forbidden: nodes" warning and carries on. serviceType: NODEPORT is not an
# exception, whatever an older copy of this chart said.
clusterRbac: false

# The account crane runs as. `create` decides only whether the ServiceAccount
# object is rendered -- the name is what the Deployment and both binding
# subjects use either way, so set create: false when your platform team already
# owns the account. Doing that makes `name` mandatory: unlike the usual chart
# scaffold this one will not fall back to the namespace's `default` account,
# which would install cleanly and grant crane's Role to every other pod there.
serviceAccount:
  create: true
  # Empty -> the chart's fullname (default "crane"). Required with create: false.
  name: ""
  annotations: {}

# -- Crane pod ----------------------------------------------------------------

# k8s only; on openshift the SCC assigns an in-range UID and this is ignored.
runAsUser: 1337

# Scheduling for the crane pod itself -- one small, always-on pod.
nodeSelector: {}
tolerations: []

# Scheduling for the engines crane spawns, passed down as
# KUBERNETES_NODE_SELECTOR_JSON / KUBERNETES_TOLERATIONS_JSON. Separate from
# the pair above because crane and its engines want opposite things from a
# node: crane is one small pod that must never move, an engine is 1-n large
# pods that exist only for the length of a run. Pointing these at a tainted,
# autoscaling pool is what lets that pool scale to zero between tests.
#
# bzm-opl-gen writes the *effective* placement here: generated with no engine
# override, these repeat nodeSelector/tolerations above. Editing the chart by
# hand, set them yourself -- they do not fall back to crane's, so leaving them
# empty puts engines on any node the cluster will take them.
#
# Engine *requests* are stamped by crane at 250m/256Mi whatever the limits say,
# and a cluster autoscaler scales on requests -- so a dedicated pool still
# packs many engines onto one node unless the pool's maxPods stops it. See the
# generated nodepools.md.
engineNodeSelector: {}
engineTolerations: []

podAnnotations: {}
podLabels: {}

# Crane is the lightweight always-running orchestrator, not a load generator --
# these are the official helm-crane chart's resourcesCrane. If the namespace
# already has a LimitRange of its own, its `max` has to clear these or the crane
# pod is rejected at admission.
crane:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
      # Same value as the request, on purpose. GKE Autopilot rewrites this
      # limit down to whatever the request says, so a larger limit is headroom
      # you do not get -- and crane sits at ~161MiB (107MiB of it /tmp) within
      # seconds of starting, which is what evicted it when the request was
      # 100Mi. Raise both together or neither.
      ephemeral-storage: 1Gi

probes:
  enabled: true
  liveness:
    # Crane's startup is slow enough that a short delay restart-loops it.
    initialDelaySeconds: 300
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

# -- Engines ------------------------------------------------------------------

# The *limits* crane stamps on the taurus engine pods it spawns. Empty ->
# BlazeMeter's documented default of 2 CPU / 8Gi, which the chart renders into
# the ConfigMap rather than leaving the env out: an engine with no limits env
# is OOMKilled at whatever the node tolerates, not "unlimited" (#132). Each
# concurrent engine also wants ~60GB disk (40GB of it /tmp). Check a cluster
# against that with `bzm-opl-gen doctor`.
#
# Engine *requests* are not settable from here: they come from the location's
# overrideCPU/overrideMemory (Settings -> Private Locations), defaulting to
# 250m/256Mi, and the scheduler packs nodes on those -- so set the overrides to
# match these limits. This chart used to ship a LimitRange in the hope of
# changing them; a LimitRange's defaultRequest only fills fields a pod leaves
# unset, so it never could -- and what it did reach was crane's own helper
# pods, handing an engine's worth of CPU and memory to jobs that need neither.
engine:
  cpuLimit: ""
  memoryLimit: ""
  # Integer MB.
  ephemeralRequestMb: ""
  ephemeralLimitMb: ""

# -- Free-form agent environment ----------------------------------------------

# Agent variables this chart has no value of its own for. BlazeMeter's
# agent-environment reference is much wider than the settings above, and
# hand-editing the rendered ConfigMap is undone by the next upgrade.
#
#   extraEnv:
#     PREFERRED_INTERFACE: eth1
#     KUBERNETES_USE_PRE_PULLING: "true"
#
# These reach the crane pod, which reads this ConfigMap via envFrom. They do NOT
# reach the engines crane spawns -- crane builds an engine's environment from
# the KUBERNETES_* values above rather than passing its own down.
#
# Anything this chart writes itself belongs to the setting that writes it, and
# naming one here renders a ConfigMap with a duplicate key. bzm-opl-gen refuses
# those before writing the overlay (generate.RESERVED_ENV); a values file
# written by hand is on its author.
extraEnv: {}

# -- Proxy --------------------------------------------------------------------

# BlazeMeter has no separate proxy-auth env vars: credentials go in the URL as
# http://user:pass@host:port. A URL with credentials is routed to the Secret
# instead of the ConfigMap automatically (when useSecret is true).
#
# Known and expected: JMeter ignores HTTP(S)_PROXY for sampler traffic, so
# engine->system-under-test goes direct. The proxy has to go in the test itself.
proxy:
  enabled: false
  http: ""
  https: ""
  # Required for the agent to reach the API server and itself.
  noProxy: "kubernetes.default,127.0.0.1,localhost"

# -- Corporate CA trust -------------------------------------------------------

# Pick one mode:
#   none            no custom trust.
#   inline          the PEM below (or caBundle.file, read from the chart
#                   directory) becomes a ConfigMap this chart owns.
#   existing        reference a ConfigMap the platform team owns and rotates,
#                   e.g. one written by trust-manager. The chart only reads it.
#   openshiftInject an empty labeled ConfigMap; OpenShift's network operator
#                   injects the cluster-wide trust bundle into it.
caBundle:
  mode: none
  pem: ""
  # Path relative to the chart directory, e.g. "certificate.crt". Ignored unless
  # mode is inline and pem is empty.
  file: ""
  existingConfigMap: ""
  key: ca-bundle.crt
  # Crane mounts the directory. Engines mount the same ConfigMap as a file via
  # KUBERNETES_CA_BUNDLE_MOUNT, which the chart derives -- do not hand-set it.
  mountPath: /var/cm

# -- Naming -------------------------------------------------------------------

# Defaults match `bzm-opl-gen generate` output so the two are interchangeable
# and the documented `-l role=role-crane` selectors keep working.
nameOverride: ""
fullnameOverride: ""
