apiVersion: v2
name: bzm-opl
description: BlazeMeter private location (OPL) agent -- performance testing and service virtualization on Kubernetes/OpenShift
type: application
# appVersion is the crane image tag; image.tag pins it per install.
version: 0.1.0
appVersion: "latest"
# The crane pod sets seccompProfile, GA from 1.19.
kubeVersion: ">=1.19.0-0"
keywords:
  - blazemeter
  - crane
  - private-location
  - opl
  - performance-testing
  - load-testing
  - service-virtualization
icon: https://github.com/Blazemeter/helm-crane/raw/main/logo.png
home: https://help.blazemeter.com/docs/guide/private-locations-install-blazemeter-agent-kubernetes.html
sources:
  - https://github.com/Blazemeter/helm-crane
annotations:
  # Service virtualization is off until sv.ingress names a backend.
  blazemeter.com/scope: performance-and-service-virtualization
