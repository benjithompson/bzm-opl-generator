{{- if .Values.clusterRbac }}
# Optional. Node reads let crane report capacity; without them it logs a
# "forbidden: nodes" warning and carries on.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bzm-opl.clusterRoleName" . }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
{{- end }}
