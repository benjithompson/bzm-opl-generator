{{- if .Values.clusterRbac }}
# OPTIONAL -- cluster-scoped, and required by nothing this chart renders. Crane
# uses node reads for capacity awareness only: without them it logs a
# "forbidden: nodes" warning and proceeds.
#
# serviceType NODEPORT does not change that, though this chart once refused the
# pairing on the theory that it did. Crane resolves its advertised address from
# its own network interfaces, and creates the NodePort Service through the
# namespaced Role. Leave clusterRbac off unless you want the capacity warning
# gone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bzm-opl.clusterRoleName" . }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
{{- end }}
