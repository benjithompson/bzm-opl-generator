apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bzm-opl.roleBindingName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bzm-opl.roleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bzm-opl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
