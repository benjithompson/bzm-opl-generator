apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bzm-opl.roleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Crane creates/manages Secrets (registry creds, test data) -- per upstream
  # helm-crane rbac-ns.yaml.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, list, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  # No `ingresses` here on purpose: Ingress has lived only in networking.k8s.io
  # since k8s 1.22, so listing it under extensions grants nothing. When service
  # virtualization is enabled the block at the end grants the one API group the
  # configured expose backend actually writes -- Ingress, Gateway, or HTTPProxy.
  - apiGroups: [extensions, apps, ""]
    resources: [pods, services, endpoints, daemonsets, "pods/*", pods/exec,
                deployments, replicasets, deployments/scale]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [watch, get, list, create, update, patch, delete, deletecollection]
{{- if include "bzm-opl.svEnabled" . }}
{{- $backend := index (include "bzm-opl.svBackends" . | fromYaml) .Values.sv.ingress }}
  # Service virtualization: crane publishes one {{ $backend.creates }} per virtual service.
  # Namespaced, like everything else here -- publishing an endpoint through an
  # ingress needs no cluster-scoped permission at all.
  - apiGroups: [{{ $backend.group }}]
    resources: [{{ join ", " $backend.resources }}]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
{{- end }}
