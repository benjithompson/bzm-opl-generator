apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bzm-opl.roleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Crane creates/manages Secrets (registry creds, test data) -- per upstream
  # helm-crane rbac-ns.yaml.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, list, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  # No ingress/gateway/route grants anywhere in this chart: publishing an
  # endpoint is a service-virtualization concern, and this chart is scoped to
  # performance testing. A location that also serves mock services needs the
  # upstream Blazemeter/helm-crane chart.
  - apiGroups: [extensions, apps, ""]
    resources: [pods, services, endpoints, daemonsets, "pods/*", pods/exec,
                deployments, replicasets, deployments/scale]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [watch, get, list, create, update, patch, delete, deletecollection]
