{{- if and .Values.useSecret (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bzm-opl.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Token generated for the private location in the BlazeMeter UI.
  # stringData accepts plain text; Kubernetes base64-encodes it on apply.
  AUTH_TOKEN: {{ .Values.authToken | quote }}
  {{- if include "bzm-opl.proxyInSecret" . }}
  # Proxy URLs embed credentials (user:pass@host) -> kept out of the ConfigMap.
  {{- with .Values.proxy.http }}
  HTTP_PROXY: {{ . | quote }}
  {{- end }}
  {{- with .Values.proxy.https }}
  HTTPS_PROXY: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
