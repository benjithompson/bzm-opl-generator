{{- if and .Values.useSecret (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bzm-opl.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The agent's token from BlazeMeter, in plain text (stringData).
  AUTH_TOKEN: {{ .Values.authToken | quote }}
  {{- if include "bzm-opl.proxyInSecret" . }}
  # Proxy URLs carrying credentials.
  {{- with .Values.proxy.http }}
  HTTP_PROXY: {{ . | quote }}
  {{- end }}
  {{- with .Values.proxy.https }}
  HTTPS_PROXY: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
