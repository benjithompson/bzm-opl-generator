{{- include "bzm-opl.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bzm-opl.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
data:
  HARBOR_ID: {{ .Values.harborId | quote }}
  SHIP_ID: {{ .Values.shipId | quote }}
  {{- if not .Values.useSecret }}
  # Readable by anyone who can read ConfigMaps; useSecret=true moves it to a Secret.
  AUTH_TOKEN: {{ .Values.authToken | quote }}
  {{- end }}
  CONTAINER_MANAGER_TYPE: KUBERNETES
  {{- if .Values.restrictEngines }}
  # Engines run as crane's UID:GID with no capabilities (see restrictEngines).
  INHERIT_RUNNING_USER_AND_GROUP: 'true'
  KUBERNETES_SECURITY_CONTEXT_CAP_JSON: '{"drop": ["ALL"]}'
  {{- end }}
  KUBERNETES_SERVICE_USE_TYPE: {{ .Values.serviceType | quote }}
  RUN_HEALTH_WEB_SERVICE: 'true'
  {{- if include "bzm-opl.svEnabled" . }}
  # Service virtualization. Endpoints are <virtual-service>-<port>-<namespace>.<subdomain>.
  KUBERNETES_WEB_EXPOSE_TYPE: {{ .Values.sv.ingress | upper | quote }}
  KUBERNETES_WEB_EXPOSE_SUB_DOMAIN: {{ .Values.sv.subdomain | quote }}
  # Required even for HTTP virtual services.
  KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME: {{ .Values.sv.tlsSecret | quote }}
  {{- if eq .Values.sv.ingress "istio" }}
  {{- with .Values.sv.istioGateway }}
  KUBERNETES_ISTIO_GATEWAY_NAME: {{ . | quote }}
  {{- else }}
  # KUBERNETES_ISTIO_GATEWAY_NAME unset: crane creates a Gateway per virtual service.
  {{- end }}
  {{- end }}
  {{- end }}
  DOCKER_REGISTRY: {{ include "bzm-opl.dockerRegistry" . | quote }}
  {{- if .Values.privateRegistry }}
  IMAGE_OVERRIDES: {{ .Values.imageOverrides | toJson | squote }}
  {{- if .Values.registryAuth }}
  # Registry credentials for engine image pulls. Readable by anyone who can read
  # ConfigMaps; prefer a cluster pull secret.
  # DOCKER_REGISTRY_USERNAME: <user>
  # DOCKER_REGISTRY_PASSWORD: <password>
  # DOCKER_REGISTRY_EMAIL: <email>
  {{- end }}
  {{- end }}
  {{- if eq (include "bzm-opl.autoUpdate" .) "true" }}
  # On: crane updates its own Deployment, so `helm upgrade` conflicts and
  # changes need uninstall + install. See autoUpdate in values.yaml.
  {{- else }}
  # Off: Helm manages the Deployment; upgrade the agent by bumping image.tag.
  {{- end }}
  AUTO_KUBERNETES_UPDATE: {{ include "bzm-opl.autoUpdate" . | squote }}
  {{- if .Values.proxy.enabled }}
  {{- if include "bzm-opl.proxyInSecret" . }}
  # HTTP(S)_PROXY carry credentials and are in {{ include "bzm-opl.secretName" . }}.
  {{- else }}
  {{- if include "bzm-opl.proxyHasCreds" . }}
  # WARNING: plaintext proxy credentials. Set useSecret=true to move them to the Secret.
  {{- end }}
  {{- with .Values.proxy.http }}
  HTTP_PROXY: {{ . | quote }}
  {{- end }}
  {{- with .Values.proxy.https }}
  HTTPS_PROXY: {{ . | quote }}
  {{- end }}
  {{- end }}
  NO_PROXY: {{ .Values.proxy.noProxy | quote }}
  {{- end }}
  {{- /* Engine placement only; crane's own placement is in the Deployment. */}}
  {{- with .Values.engineTolerations }}
  KUBERNETES_TOLERATIONS_JSON: {{ toJson . | squote }}
  {{- end }}
  {{- with .Values.engineNodeSelector }}
  KUBERNETES_NODE_SELECTOR_JSON: {{ toJson . | squote }}
  {{- end }}
  {{- /* Always set: an engine with no limits can be OOM-killed by the node. */}}
  KUBERNETES_RESOURCES_LIMITS_CPU: {{ include "bzm-opl.engineCpuLimit" . | quote }}
  KUBERNETES_RESOURCES_LIMITS_MEMORY: {{ include "bzm-opl.engineMemoryLimit" . | quote }}
  {{- with .Values.engine.ephemeralRequestMb }}
  KUBERNETES_REQUESTS_EPHEMERAL_STORAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.engine.ephemeralLimitMb }}
  KUBERNETES_LIMITS_EPHEMERAL_STORAGE: {{ . | quote }}
  {{- end }}
  {{- if include "bzm-opl.caEnabled" . }}
  {{- $cm := include "bzm-opl.caConfigMapName" . }}
  {{- $key := .Values.caBundle.key }}
  {{- $path := printf "%s/%s" (trimSuffix "/" .Values.caBundle.mountPath) $key }}
  {{- if eq .Values.caBundle.mode "existing" }}
  # CA bundle from the existing ConfigMap '{{ $cm }}', which this chart only reads.
  {{- else if eq .Values.caBundle.mode "openshiftInject" }}
  # OpenShift cluster trust bundle (operator-injected ConfigMap).
  {{- else }}
  # Corporate CA bundle, from the ConfigMap this chart creates.
  {{- end }}
  # Mounted into crane; engines get it via KUBERNETES_CA_BUNDLE_MOUNT.
  REQUESTS_CA_BUNDLE: {{ $path | quote }}
  AWS_CA_BUNDLE: {{ $path | quote }}
  KUBERNETES_CA_BUNDLE_MOUNT: {{ printf "REQUESTS_CA_BUNDLE=%s=%s:AWS_CA_BUNDLE=%s=%s" $cm $key $cm $key | quote }}
  {{- end }}
  {{- /* extraEnv, quoted because ConfigMap values must be strings. */}}
  {{- range $name, $value := .Values.extraEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
