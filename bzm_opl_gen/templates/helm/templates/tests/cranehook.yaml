{{- if .Values.craneHook.enabled }}
{{- /*
crane-hook (github.com/Blazemeter/crane-hook), a cluster-readiness check run by
`helm test <release>` after install.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bzm-opl.hookRoleName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [rolebindings, roles]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets, namespaces, pods, nodes, services, endpoints, configmaps]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: ["networking.istio.io"]
    resources: [virtualservices, destinationrules, gateways, serviceentries]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bzm-opl.hookRoleName" . }}-binding
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bzm-opl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "bzm-opl.hookRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: cranehook
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "bzm-opl.labels" . | nindent 4 }}
spec:
  serviceAccountName: {{ include "bzm-opl.serviceAccountName" . }}
  automountServiceAccountToken: true
  restartPolicy: "Never"
  containers:
    - name: cranehook-ctr
      image: {{ include "bzm-opl.hookImage" . | quote }}
      imagePullPolicy: "Always"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        {{- if ne .Values.platform "openshift" }}
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        {{- end }}
      env:
        - name: WORKING_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: ROLE_NAME
          value: {{ include "bzm-opl.hookRoleName" . | quote }}
        - name: ROLE_BINDING_NAME
          value: {{ printf "%s-binding" (include "bzm-opl.hookRoleName" .) | quote }}
        - name: SERVICE_ACCOUNT_NAME
          value: {{ include "bzm-opl.serviceAccountName" . | quote }}
        - name: DOCKER_REGISTRY
          value: {{ include "bzm-opl.dockerRegistry" . | quote }}
        {{- if include "bzm-opl.svEnabled" . }}
        {{- /* Only when service virtualization is enabled. */}}
        - name: KUBERNETES_WEB_EXPOSE_TYPE
          value: {{ .Values.sv.ingress | upper | quote }}
        - name: KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME
          value: {{ .Values.sv.tlsSecret | quote }}
        {{- end }}
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: 200m, memory: 512Mi }
      volumeMounts:
        - name: testhook-tmp
          mountPath: /tmp/testhook
  volumes:
    - name: testhook-tmp
      emptyDir: {}
{{- end }}
