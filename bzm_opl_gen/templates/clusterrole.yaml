# Optional, cluster-scoped. Node reads let crane report capacity; without them
# it logs a "forbidden: nodes" warning and works normally, including with
# NODEPORT and service virtualization.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: cluster-role-crane }
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
