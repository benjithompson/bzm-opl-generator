[project]
name = "bzm-opl-gen"
version = "0.1.0"
description = "Generate and live-test BlazeMeter OPL (private location) k8s/OpenShift deployments from a customer's actual BlazeMeter account"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# fastapi belongs in `test`, not just `ui`: tests/test_server.py importorskips
# it, so a venv without it reports a clean pass while testing none of the HTTP
# layer. `dev` is the one to install from a checkout.
test = ["pyyaml", "pytest", "httpx", "fastapi>=0.110"]
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pyyaml", "pytest", "httpx", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
bzm-opl-gen = "bzm_opl_gen.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bzm_opl_gen*"]

[tool.setuptools.package-data]
# templates/helm is the Helm packaging of the same manifests. Its files are
# listed separately because generate.py's `templates/*.yaml` glob does not
# recurse, and the chart's own templates are .tpl/.txt/.helmignore besides.
bzm_opl_gen = ["templates/*.yaml", "templates/helm/*", "templates/helm/templates/*",
               "profiles/*.json", "ui_dist/**/*"]
