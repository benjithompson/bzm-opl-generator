[project]
name = "bzm-opl-gen"
version = "0.3.2"
description = "Generate and live-test BlazeMeter OPL (private location) k8s/OpenShift deployments from a customer's actual BlazeMeter account"
# Without this the PyPI page renders with no body at all -- the description
# above is the one-liner, not the page.
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ben Thompson" }]
keywords = ["blazemeter", "kubernetes", "openshift", "helm", "load-testing",
            "private-location", "performance-testing", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Traffic Generation",
    "Topic :: System :: Systems Administration",
]
# 3.10 because the `mcp` SDK requires it. 3.9 has been end-of-life since
# October 2025, and the generator itself still uses nothing newer -- the floor
# is the SDK's, not ours.
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/benjithompson/bzm-opl-generator"
Repository = "https://github.com/benjithompson/bzm-opl-generator"
Issues = "https://github.com/benjithompson/bzm-opl-generator/issues"
Changelog = "https://github.com/benjithompson/bzm-opl-generator/blob/main/CHANGELOG.md"
Documentation = "https://github.com/benjithompson/bzm-opl-generator#documentation"

[project.optional-dependencies]
# fastapi belongs in `test`, not just `ui`: tests/test_server.py importorskips
# it, so a venv without it reports a clean pass while testing none of the HTTP
# layer. `mcp` is in `test` for exactly that reason too. `dev` is the one to
# install from a checkout.
test = ["pyyaml", "pytest", "httpx", "fastapi>=0.110", "mcp>=2"]
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=2"]
dev = ["pyyaml", "pytest", "httpx", "fastapi>=0.110", "uvicorn>=0.27", "mcp>=2"]

[project.scripts]
bzm-opl-gen = "bzm_opl_gen.cli:main"

[build-system]
# 77 rather than 61 for PEP 639: `license = "Apache-2.0"` as a plain string and
# `license-files` are only understood from there on. An older setuptools does
# not warn about them, it fails the build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# An explicit list rather than `find`, because docs/ is mapped in below and
# discovery cannot see it: it lives at the repo root, where it is edited and
# where every relative link between the pages resolves. A new subpackage has to
# be added here by hand -- there are none today, and templates/ profiles/
# ui_dist/ are data rather than packages.
[tool.setuptools]
packages = ["bzm_opl_gen", "bzm_opl_gen.docs", "bzm_opl_gen.docs.repro"]

# The MCP server serves these as resources, so a session with no checkout of
# this repo can still read them. Mapped rather than copied: one set of files on
# disk, and the wheel builds its copy from the same ones.
[tool.setuptools.package-dir]
"bzm_opl_gen.docs" = "docs"
"bzm_opl_gen.docs.repro" = "docs/repro"

[tool.setuptools.package-data]
# templates/helm is the Helm packaging of the same manifests, and `generate
# --format helm` copies whatever is in it into the bundle -- so a file missing
# here is missing from every generated chart, not just from the wheel.
# Enumerated per directory because these globs do not recurse, and .helmignore
# is named because a leading-dot file is not matched by `*` either.
bzm_opl_gen = ["templates/*.yaml", "templates/helm/*", "templates/helm/.helmignore",
               "templates/helm/templates/*", "templates/helm/templates/tests/*",
               "profiles/*.json", "ui_dist/**/*"]
"bzm_opl_gen.docs" = ["*.md"]
# The reproductions three shipped pages tell the reader to `kubectl apply -f`.
# The MCP server's audience has no checkout, so a page served from the wheel
# naming a file the wheel does not carry is an instruction that cannot be
# followed. Its own entry because the glob above neither recurses nor matches
# `.yaml`.
"bzm_opl_gen.docs.repro" = ["*.yaml"]
