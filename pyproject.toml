[project]
name = "bzm-opl-gen"
version = "0.2.0"
description = "Generate and live-test BlazeMeter OPL (private location) k8s/OpenShift deployments from a customer's actual BlazeMeter account"
# 3.10 because the `mcp` SDK requires it. 3.9 has been end-of-life since
# October 2025, and the generator itself still uses nothing newer -- the floor
# is the SDK's, not ours.
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# fastapi belongs in `test`, not just `ui`: tests/test_server.py importorskips
# it, so a venv without it reports a clean pass while testing none of the HTTP
# layer. `mcp` is in `test` for exactly that reason too. `dev` is the one to
# install from a checkout.
test = ["pyyaml", "pytest", "httpx", "fastapi>=0.110", "mcp>=2"]
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=2"]
dev = ["pyyaml", "pytest", "httpx", "fastapi>=0.110", "uvicorn>=0.27", "mcp>=2"]

[project.scripts]
bzm-opl-gen = "bzm_opl_gen.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bzm_opl_gen*"]

[tool.setuptools.package-data]
# templates/helm is the Helm packaging of the same manifests, and `generate
# --format helm` copies whatever is in it into the bundle -- so a file missing
# here is missing from every generated chart, not just from the wheel.
# Enumerated per directory because these globs do not recurse, and .helmignore
# is named because a leading-dot file is not matched by `*` either.
bzm_opl_gen = ["templates/*.yaml", "templates/helm/*", "templates/helm/.helmignore",
               "templates/helm/templates/*",
               "profiles/*.json", "ui_dist/**/*"]
