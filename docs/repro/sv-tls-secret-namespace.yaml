# Reproduction for #185 -- which namespace does the wildcard TLS secret
# (`sv_tls_secret`, `KUBERNETES_WEB_EXPOSE_TLS_SECRET_NAME`) have to be in?
#
# No BlazeMeter account and no crane needed: this is crane's Ingress shape in an
# agent namespace, so the question can be put to any controller in minutes.
# BlazeMeter's *Bring your own certificate* page says the secret "must exist in
# default namespace unless ingress configuration is modified"; this settles what
# that sentence is actually about.
#
#   kubectl apply -f docs/repro/sv-tls-secret-namespace.yaml
#   kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 18443:443 &
#
#   openssl req -x509 -newkey rsa:2048 -sha256 -days 30 -nodes \
#     -keyout wildcard.key -out wildcard.crt -subj "/CN=*.apps.bzm-opl.test" \
#     -addext "subjectAltName=DNS:*.apps.bzm-opl.test"
#
#   probe() { openssl s_client -connect 127.0.0.1:18443 \
#       -servername vs-8080-bzm-sv185.apps.bzm-opl.test </dev/null 2>/dev/null \
#     | openssl x509 -noout -subject; }
#
#   probe                                             # A: no secret anywhere
#   kubectl -n default   create secret tls wildcard-credential --cert=wildcard.crt --key=wildcard.key
#   probe                                             # B: BlazeMeter's namespace
#   kubectl -n bzm-sv185 create secret tls wildcard-credential --cert=wildcard.crt --key=wildcard.key
#   probe                                             # C: the agent namespace
#
# Measured 2026-08-07, ingress-nginx v1.11.3 on k8s 1.32 (minikube), and
# reproduced the same three ways against crane 3.7.56's own Ingress on a live
# mockServices location:
#
#   A  CN=Kubernetes Ingress Controller Fake Certificate   -- and HTTP 200
#   B  CN=Kubernetes Ingress Controller Fake Certificate   -- unchanged
#   C  CN=*.apps.bzm-opl.test                              -- ours, verify 0
#
# A and B are the point: the endpoint answers 200 to a client that does not
# verify, so a missing secret presents as a working virtual service serving a
# certificate nobody can trust. The controller says which namespace it looked in:
#
#   Error getting SSL certificate "bzm-sv185/wildcard-credential": local SSL
#   certificate bzm-sv185/wildcard-credential was not found. Using default
#   certificate
#
# -- the Ingress's own namespace, which is where crane creates it (the only
# grant it has is a namespaced Role), which is the agent's. There is no
# cross-namespace lookup to configure: what BlazeMeter's page means by "unless
# ingress configuration is modified" is the controller-wide
# `--default-ssl-certificate=<namespace>/<name>` flag, which serves one
# certificate for every host whose per-Ingress secret is missing (measured: it
# rescues case A, and `default` in it is a coincidence of their walkthrough).
#
# If you are re-running these by hand, take that flag back off before
# concluding anything -- left on, it makes case A look like a pass.
apiVersion: v1
kind: Namespace
metadata:
  name: bzm-sv185
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock
  namespace: bzm-sv185
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock}
  template:
    metadata:
      labels: {app: mock}
    spec:
      containers:
        - name: web
          # Unprivileged so it listens on 8080 without root, matching the mock
          # pod's port and staying deployable under a restricted PSA namespace.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
---
# Crane's Service shape: published port 80, port *named* "8080", targetPort 8080.
apiVersion: v1
kind: Service
metadata:
  name: crane-shaped
  namespace: bzm-sv185
spec:
  selector: {app: mock}
  ports:
    - name: "8080"
      port: 80
      targetPort: 8080
---
# Crane's Ingress shape, in the agent namespace, naming the wildcard TLS secret
# by the name sv_tls_secret carries. The backend port is crane's spec-wrong 8080
# (see crane-nginx-ingress-port.md) -- kept so this file stays one object set
# with the other repro, and irrelevant to the question asked here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crane-shaped
  namespace: bzm-sv185
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vs-8080-bzm-sv185.apps.bzm-opl.test
      secretName: wildcard-credential
  rules:
    - host: vs-8080-bzm-sv185.apps.bzm-opl.test
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: crane-shaped
                port:
                  number: 8080
