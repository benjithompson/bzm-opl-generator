name: release

# Cut a release by pushing a version tag:  git tag v0.3.1 && git push --tags
# The tag is the release, and it fans out to three places people install from:
# PyPI (`pipx install "bzm-opl-gen[ui]"`, the front door), the wheel attached
# below, and the git URL at that tag. The notes carry the command people paste
# -- `.github/release-footer.md`, VERSION substituted below.
# `workflow_dispatch` is the same release, started by hand:
#
#   gh workflow run release.yml --ref v0.3.2
#
# It exists because the push trigger is a *webhook*, and a webhook is a thing
# that can be dropped. During GitHub's Actions incident on 2026-08-06 webhook
# processing fell to ~15%, so a tag push produced no run at all -- not a queued
# one, not a failed one, nothing to retry. Re-pushing does not help either: the
# remote ref already matches, so there is no ref change to emit an event for,
# and the fix was to delete the remote tag and push it again for another ~15%
# roll of the dice. `gh workflow run` goes through the REST API instead and
# needs no webhook, so it works when the push trigger cannot.
#
# **Dispatch it on the tag, never on a branch.** The version this publishes is
# read from the ref's name, so `--ref main` would try to release a version
# called "main"; the gate below refuses that rather than letting it run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Declared per job rather than here: the two jobs need different things, and the
# publishing one must not inherit write access to the repository.
permissions: {}

jobs:
  release:
    # Same switch as tests.yml, where it is explained. Only a tag push reaches
    # this workflow, so the pull_request half can never fire here -- it is
    # written the same way regardless, because a reader comparing the two files
    # should not have to work out whether the difference is meaningful.
    # Worth knowing it *is* your machine when RUNNER_LABELS is set: this job
    # builds the wheel and creates the Release.
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    permissions:
      contents: write        # required to create the Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The tag is what users will pin to, so it must not disagree with the
      # version baked into the wheel.
      #
      # The ref-type check is only reachable from `workflow_dispatch`, which
      # takes any ref: the push trigger already filters to `v*` tags. Dispatched
      # on a branch, every later step still runs -- the name would just be
      # "main", and the release would be published under it. Refusing here costs
      # one comparison; finding out costs a release nobody can delete cleanly.
      - name: tag matches pyproject version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::this workflow releases a tag, but was started on $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
            echo "::error::re-run it with a tag: gh workflow run release.yml --ref vX.Y.Z"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag, but pyproject.toml says $proj"
            exit 1
          fi
          echo "version $proj"

      - run: pip install -e ".[dev]" build

      # Don't publish a wheel that fails its own tests.
      - name: optional test deps are actually importable
        run: python -c "import fastapi, yaml, httpx, mcp"
      - run: pytest tests -q

      # setuptools stages into `build/lib` and does not remove what it finds
      # there, so a leftover from an earlier build is copied into the wheel as
      # if it were current. `ui_dist` is the one that bites: its filenames carry
      # a content hash, so a rebuilt bundle never overwrites the old one and the
      # wheel ends up carrying both. `index.html` names only the live pair, so
      # this is dead weight rather than a wrong UI -- but it is ~300KB of it in
      # every install. A GitHub-hosted runner starts clean and would never show
      # this; a self-hosted one reuses its workspace and does.
      - run: rm -rf build dist
      - run: python -m build

      # The UI bundle and templates are package data; a wheel missing them
      # installs fine and then fails at runtime, so check before publishing.
      - name: wheel carries templates, profiles, docs and the UI bundle
        run: |
          python - <<'PY'
          import glob, os, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          missing = [p for p in ("bzm_opl_gen/templates/deployment.yaml",
                                 # The chart is package data too, and its own
                                 # subdirectory -- the templates/*.yaml glob
                                 # does not recurse into it.
                                 "bzm_opl_gen/templates/helm/Chart.yaml",
                                 "bzm_opl_gen/templates/helm/values.yaml",
                                 "bzm_opl_gen/templates/helm/templates/deployment.yaml",
                                 # ...and its tests/ subdirectory, which needs
                                 # its own glob for the same reason.
                                 "bzm_opl_gen/templates/helm/templates/tests/cranehook.yaml",
                                 # A leading-dot file is not matched by `*` in
                                 # package-data and has to be named there.
                                 "bzm_opl_gen/templates/helm/.helmignore",
                                 "bzm_opl_gen/profiles/standard.json",
                                 "bzm_opl_gen/ui_dist/index.html")
                     if p not in names]
          # The MCP server serves docs/ as resources, and they are mapped in
          # from the repo root rather than living under the package -- so a
          # checkout serves them and a wheel silently would not. Every page,
          # not a sample: the mapping is all-or-nothing but the glob is not,
          # and a session with no checkout has these and nothing else.
          shipped = {n.split("/")[-1] for n in names
                     if n.startswith("bzm_opl_gen/docs/") and n.endswith(".md")}
          expected = {f for f in os.listdir("docs") if f.endswith(".md")}
          if expected - shipped:
              sys.exit(f"{whl} is missing docs: {sorted(expected - shipped)}")
          # docs/repro/ is its own package for the same reason and needs its
          # own assertion: three shipped pages tell the reader to `kubectl
          # apply -f` one of these, and the audience that reads them from a
          # wheel is the one with no checkout to fall back on.
          repro = {n.split("/")[-1] for n in names
                   if n.startswith("bzm_opl_gen/docs/repro/") and n.endswith(".yaml")}
          want = {f for f in os.listdir("docs/repro") if f.endswith(".yaml")}
          if want - repro:
              sys.exit(f"{whl} is missing repro files: {sorted(want - repro)}")
          if missing:
              sys.exit(f"{whl} is missing: {missing}")
          print(f"{whl}: {len(names)} entries, {len(shipped)} docs, "
                f"{len(repro)} repro files, package data present")
          PY

      # Notes come from CHANGELOG.md, not from commit subjects: they are for
      # the person upgrading, and nobody writes those by accident. The footer
      # is appended to every release so install instructions stay identical.
      - name: assemble release notes
        run: |
          python - <<'PY' > notes.md
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read()
          # Stops at the next release heading, or at the block of link
          # reference definitions Keep a Changelog puts at the foot of the file
          # (`[0.2.0]: https://...`). Without the second alternative the oldest
          # section runs to `\Z` and publishes those links as part of its notes
          # -- which only the *oldest* section can hit, so it would sit here
          # unnoticed until somebody re-cut the first release.
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)",
                        text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit(f"CHANGELOG.md has no entry for {version} -- add one before tagging")
          print(m.group(1).strip())
          PY
          # The footer pins the tag it is published under: a static `@v0.2.0`
          # in the file would tell every later release's readers to install an
          # older one. VERSION is the tag, VERSION_NUMBER the same without `v`
          # (the wheel filename's form) -- longest placeholder first, or the
          # first substitution eats the prefix of the second.
          sed -e "s/VERSION_NUMBER/${GITHUB_REF_NAME#v}/g" \
              -e "s/VERSION/${GITHUB_REF_NAME}/g" \
              .github/release-footer.md >> notes.md
          echo "--- notes.md ---"; cat notes.md

      # Through the API rather than `gh`, because the self-hosted runners do not
      # carry it -- v0.3.0 built, tested and assembled its notes and then died
      # here on `gh: command not found`, which is a whole release's worth of
      # work thrown away at the last step. GitHub's own images have `gh`, ours
      # do not, and this job was the only thing in the repo that had ever needed
      # it. `github-script` runs on the node the runner already uses for
      # checkout and setup-python, so it needs nothing installed.
      - name: publish
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME;
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: tag,
              body: fs.readFileSync('notes.md', 'utf8'),
            });
            // Every file `python -m build` produced -- the wheel and the sdist.
            // Uploaded one at a time so a failure names which asset, rather
            // than leaving a release whose contents nobody can account for.
            for (const name of fs.readdirSync('dist')) {
              const data = fs.readFileSync(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
              core.info(`uploaded ${name} (${data.length} bytes)`);
            }
            core.info(`published ${release.html_url}`);

      # Handed to the PyPI job rather than rebuilt there: the artifacts people
      # install must be the ones this job tested and asserted the contents of.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # PyPI is the front door -- `pipx install "bzm-opl-gen[ui]"` with no URL and
  # no auth -- and the GitHub Release stays as the alternative route.
  #
  # **This job is pinned to ubuntu-latest and must stay there.** It is the one
  # place an OIDC identity that can publish under this project's name is minted,
  # and minting it on a long-lived self-hosted runner would put that identity on
  # the same host every other job has touched. `id-token: write` and nothing
  # else: it neither needs nor gets write access to the repository.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/bzm-opl-gen
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Trusted publishing: no API token exists to leak or rotate. PyPI has to
      # know about this repo, this workflow filename and this environment name
      # first -- configure the publisher there before the first tag, or this
      # step fails with a 403 that reads like a permissions bug in the job.
      - uses: pypa/gh-action-pypi-publish@release/v1
