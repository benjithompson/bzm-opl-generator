name: release

# Cut a release by pushing a version tag:  git tag v0.3.1 && git push --tags
# The tag is what users install -- `pipx install "bzm-opl-gen[ui] @
# git+https://...@vX.Y.Z"` resolves it out of the repo, so pushing the tag is
# the release. This job builds the wheel and attaches it as the alternative
# route, and carries the notes, which is where the command people paste comes
# from: `.github/release-footer.md`, VERSION substituted below.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # required to create the Release

jobs:
  release:
    # Same RUNNER_LABELS switch as tests.yml, where it is explained. It applies
    # here too rather than pinning releases to GitHub-hosted, because the account
    # problem that motivated it blocks this workflow just as completely -- a
    # release that cannot run is not safer than one that runs on your own
    # machine. Worth knowing that it *is* your machine, though: this job builds
    # the wheel and creates the Release.
    runs-on: ${{ vars.RUNNER_LABELS || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The tag is what users will pin to, so it must not disagree with the
      # version baked into the wheel.
      - name: tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag, but pyproject.toml says $proj"
            exit 1
          fi
          echo "version $proj"

      - run: pip install -e ".[dev]" build

      # Don't publish a wheel that fails its own tests.
      - name: optional test deps are actually importable
        run: python -c "import fastapi, yaml, httpx, mcp"
      - run: pytest tests -q

      - run: python -m build

      # The UI bundle and templates are package data; a wheel missing them
      # installs fine and then fails at runtime, so check before publishing.
      - name: wheel carries templates, profiles, docs and the UI bundle
        run: |
          python - <<'PY'
          import glob, os, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          missing = [p for p in ("bzm_opl_gen/templates/deployment.yaml",
                                 # The chart is package data too, and its own
                                 # subdirectory -- the templates/*.yaml glob
                                 # does not recurse into it.
                                 "bzm_opl_gen/templates/helm/Chart.yaml",
                                 "bzm_opl_gen/templates/helm/values.yaml",
                                 "bzm_opl_gen/templates/helm/templates/deployment.yaml",
                                 # ...and its tests/ subdirectory, which needs
                                 # its own glob for the same reason.
                                 "bzm_opl_gen/templates/helm/templates/tests/cranehook.yaml",
                                 # A leading-dot file is not matched by `*` in
                                 # package-data and has to be named there.
                                 "bzm_opl_gen/templates/helm/.helmignore",
                                 "bzm_opl_gen/profiles/standard.json",
                                 "bzm_opl_gen/ui_dist/index.html")
                     if p not in names]
          # The MCP server serves docs/ as resources, and they are mapped in
          # from the repo root rather than living under the package -- so a
          # checkout serves them and a wheel silently would not. Every page,
          # not a sample: the mapping is all-or-nothing but the glob is not,
          # and a session with no checkout has these and nothing else.
          shipped = {n.split("/")[-1] for n in names
                     if n.startswith("bzm_opl_gen/docs/") and n.endswith(".md")}
          expected = {f for f in os.listdir("docs") if f.endswith(".md")}
          if expected - shipped:
              sys.exit(f"{whl} is missing docs: {sorted(expected - shipped)}")
          # docs/repro/ is its own package for the same reason and needs its
          # own assertion: three shipped pages tell the reader to `kubectl
          # apply -f` one of these, and the audience that reads them from a
          # wheel is the one with no checkout to fall back on.
          repro = {n.split("/")[-1] for n in names
                   if n.startswith("bzm_opl_gen/docs/repro/") and n.endswith(".yaml")}
          want = {f for f in os.listdir("docs/repro") if f.endswith(".yaml")}
          if want - repro:
              sys.exit(f"{whl} is missing repro files: {sorted(want - repro)}")
          if missing:
              sys.exit(f"{whl} is missing: {missing}")
          print(f"{whl}: {len(names)} entries, {len(shipped)} docs, "
                f"{len(repro)} repro files, package data present")
          PY

      # Notes come from CHANGELOG.md, not from commit subjects: they are for
      # the person upgrading, and nobody writes those by accident. The footer
      # is appended to every release so install instructions stay identical.
      - name: assemble release notes
        run: |
          python - <<'PY' > notes.md
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
                        text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit(f"CHANGELOG.md has no entry for {version} -- add one before tagging")
          print(m.group(1).strip())
          PY
          # The footer pins the tag it is published under: a static `@v0.2.0`
          # in the file would tell every later release's readers to install an
          # older one. VERSION is the tag, VERSION_NUMBER the same without `v`
          # (the wheel filename's form) -- longest placeholder first, or the
          # first substitution eats the prefix of the second.
          sed -e "s/VERSION_NUMBER/${GITHUB_REF_NAME#v}/g" \
              -e "s/VERSION/${GITHUB_REF_NAME}/g" \
              .github/release-footer.md >> notes.md
          echo "--- notes.md ---"; cat notes.md

      # Through the API rather than `gh`, because the self-hosted runners do not
      # carry it -- v0.3.0 built, tested and assembled its notes and then died
      # here on `gh: command not found`, which is a whole release's worth of
      # work thrown away at the last step. GitHub's own images have `gh`, ours
      # do not, and this job was the only thing in the repo that had ever needed
      # it. `github-script` runs on the node the runner already uses for
      # checkout and setup-python, so it needs nothing installed.
      - name: publish
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME;
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: tag,
              body: fs.readFileSync('notes.md', 'utf8'),
            });
            // Every file `python -m build` produced -- the wheel and the sdist.
            // Uploaded one at a time so a failure names which asset, rather
            // than leaving a release whose contents nobody can account for.
            for (const name of fs.readdirSync('dist')) {
              const data = fs.readFileSync(`dist/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
              core.info(`uploaded ${name} (${data.length} bytes)`);
            }
            core.info(`published ${release.html_url}`);
