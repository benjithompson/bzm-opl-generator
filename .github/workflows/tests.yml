name: tests

on:
  push:
    branches: [main]
  pull_request:

# Where every job in this file runs, and in release.yml too. Three inputs decide
# it, and a public pull_request outranks the other two:
#
#   public repo + pull_request  -> always ubuntu-latest, whatever RUNNER_LABELS says
#   anything else, unset        -> ubuntu-latest
#   anything else, RUNNER_LABELS -> a runner registered to this repo
#
# **On a public repo a pull_request must never reach a self-hosted runner.**
# A fork PR carries its own workflow, its own `conftest.py`, its own
# `package.json` lifecycle scripts and its own build backend, so `pip install
# -e .`, `pytest` and `npm ci` are each arbitrary code execution by whoever
# opened it. The runners here are long-lived rather than ephemeral, so one
# poisoned job does not end with that job -- it sits on the host that later
# builds the release wheel.
#
# The `private` half is what makes that rule affordable rather than theoretical.
# **A private repo cannot be forked by a stranger**, so the attack needs an
# account that already has push access, and the exposure the rule exists for
# does not exist yet. Meanwhile GitHub-hosted minutes are metered on a private
# repo and free and unmetered on a public one -- with this account throttled to
# roughly one hosted runner at a time, a blanket rule left three of four jobs
# queued until their 15-minute allocation timeout cancelled them, so it bought
# no safety and cost every green tick. Keyed on `private`, the same commit runs
# self-hosted today and hosted the moment the repo is flipped, with no edit.
#
# It also fails in the safe direction: `github.event.repository.private` missing
# or unreadable is falsy, which reads as public, which forces ubuntu-latest.
# The mistake this cannot make is the one that matters.
#
# RUNNER_LABELS lives under Settings -> Secrets and variables -> Actions ->
# Variables, and deleting it is how you go back; neither direction needs a
# commit. One label only in this form. Several needs the array:
#   ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
# with RUNNER_LABELS set to a JSON array, e.g. ["self-hosted","linux","arm64"].
#
# Note the failure mode self-hosted buys: a job with no runner online does not
# fail, it queues, so a green tick can be a job that never ran. Check
# Settings -> Actions -> Runners shows Idle before trusting a quiet push -- and
# that is now reachable from a PR again, which is exactly when it is easiest to
# mistake a queue for a pass.
jobs:
  offline:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.13 catches stdlib drift.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      # tests/test_server.py importorskips fastapi, so a missing optional dep
      # turns into a clean-looking pass that tested none of the HTTP layer.
      # Fail here instead, where the cause is obvious. `mcp` is on the same
      # list for the same reason -- the MCP suite would skip itself.
      - name: optional test deps are actually importable
        run: python -c "import fastapi, yaml, httpx, mcp"

      - run: pytest tests -q

      # The no-account path a new contributor takes first. Also proves the
      # sample facts file still matches what the generator expects.
      - name: generate from the checked-in sample facts
        run: |
          python -m bzm_opl_gen generate \
              --facts examples/facts.example.json \
              --namespace ci-demo -o "$RUNNER_TEMP/out"
          test -s "$RUNNER_TEMP/out/bzm_deployment.yaml"

      # Same path in the other format. The chart is copied out of package data,
      # so this is also what catches a chart file that never shipped.
      - name: generate the chart from the same sample facts
        run: |
          python -m bzm_opl_gen generate --format helm \
              --facts examples/facts.example.json \
              --namespace ci-demo -o "$RUNNER_TEMP/chart"
          test -s "$RUNNER_TEMP/chart/bzm-opl-values.yaml"
          test -s "$RUNNER_TEMP/chart/helm/templates/deployment.yaml"
          test -s "$RUNNER_TEMP/chart/helm/.helmignore"

  # `--format helm` renders the same objects as `--format manifests`. Its own
  # job because it is the one check that needs the helm binary, and the offline
  # suite must not: a suite that skips when a tool is missing reports a clean
  # pass having tested nothing (the fastapi lesson, one job up).
  helm:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v5

      - run: pip install -e ".[dev]"

      - name: the chart lints on its own
        run: |
          helm lint --strict bzm_opl_gen/templates/helm \
              --set harborId=h --set shipId=s --set-string authToken=t

      - name: helm and manifests render the same objects
        run: python tests/helm_parity.py

  # The web UI. Separate from the python job rather than bolted onto its
  # matrix: it shares no toolchain with it, and running it twice over two
  # python versions would say nothing new. The suite is the option-group
  # lifecycle -- plain data in, data out -- which is the part of the form that
  # used to drift silently between the fields and the wipe list.
  ui:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
