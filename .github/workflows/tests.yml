name: tests

# `workflow_dispatch` runs the same four jobs on any ref, started by hand:
#
#   gh workflow run tests.yml --ref main
#
# Both triggers above are webhooks, and a webhook can be dropped: GitHub's
# Actions incident on 2026-08-06 throttled processing to ~15%, and pushes and
# merges stopped producing runs at all -- not queued ones, not failed ones,
# nothing to retry. Pushing again does not help, because an unchanged ref emits
# no event. `gh workflow run` goes through the REST API and needs none of that.
#
# Unlike release.yml's, this one takes any ref happily: these jobs read the
# checkout and nothing about the ref's name, so running them on a branch is
# exactly what you would want.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Where every job in this file runs, and in release.yml too. Three inputs decide
# it, and a public pull_request outranks the other two:
#
#   public repo + pull_request  -> always ubuntu-latest, whatever RUNNER_LABELS says
#   anything else, unset        -> ubuntu-latest
#   anything else, RUNNER_LABELS -> a runner registered to this repo
#
# **On a public repo a pull_request must never reach a self-hosted runner.**
# A fork PR carries its own workflow, its own `conftest.py`, its own
# `package.json` lifecycle scripts and its own build backend, so `pip install
# -e .`, `pytest` and `npm ci` are each arbitrary code execution by whoever
# opened it. The runners here are long-lived rather than ephemeral, so one
# poisoned job does not end with that job -- it sits on the host that later
# builds the release wheel.
#
# The `private` half is what makes that rule affordable rather than theoretical.
# **A private repo cannot be forked by a stranger**, so the attack needs an
# account that already has push access, and the exposure the rule exists for
# does not exist yet. Meanwhile GitHub-hosted minutes are metered on a private
# repo and free and unmetered on a public one -- with this account throttled to
# roughly one hosted runner at a time, a blanket rule left three of four jobs
# queued until their 15-minute allocation timeout cancelled them, so it bought
# no safety and cost every green tick. Keyed on `private`, the same commit runs
# self-hosted today and hosted the moment the repo is flipped, with no edit.
#
# It also fails in the safe direction: `github.event.repository.private` missing
# or unreadable is falsy, which reads as public, which forces ubuntu-latest.
# The mistake this cannot make is the one that matters.
#
# RUNNER_LABELS lives under Settings -> Secrets and variables -> Actions ->
# Variables, and deleting it is how you go back; neither direction needs a
# commit. One label only in this form. Several needs the array:
#   ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
# with RUNNER_LABELS set to a JSON array, e.g. ["self-hosted","linux","arm64"].
#
# Note the failure mode self-hosted buys: a job with no runner online does not
# fail, it queues, so a green tick can be a job that never ran. Check
# Settings -> Actions -> Runners shows Idle before trusting a quiet push -- and
# that is now reachable from a PR again, which is exactly when it is easiest to
# mistake a queue for a pass.
jobs:
  offline:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.13 catches stdlib drift.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      # tests/test_server.py importorskips fastapi, so a missing optional dep
      # turns into a clean-looking pass that tested none of the HTTP layer.
      # Fail here instead, where the cause is obvious. `mcp` is on the same
      # list for the same reason -- the MCP suite would skip itself.
      - name: optional test deps are actually importable
        run: python -c "import fastapi, yaml, httpx, mcp"

      - run: pytest tests -q

      # The no-account path a new contributor takes first. Also proves the
      # sample facts file still matches what the generator expects.
      - name: generate from the checked-in sample facts
        run: |
          python -m bzm_opl_gen generate \
              --facts examples/facts.example.json \
              --namespace ci-demo -o "$RUNNER_TEMP/out"
          test -s "$RUNNER_TEMP/out/bzm_deployment.yaml"

      # Same path in the other format. The chart is copied out of package data,
      # so this is also what catches a chart file that never shipped.
      - name: generate the chart from the same sample facts
        run: |
          python -m bzm_opl_gen generate --format helm \
              --facts examples/facts.example.json \
              --namespace ci-demo -o "$RUNNER_TEMP/chart"
          test -s "$RUNNER_TEMP/chart/bzm-opl-values.yaml"
          test -s "$RUNNER_TEMP/chart/helm/templates/deployment.yaml"
          test -s "$RUNNER_TEMP/chart/helm/.helmignore"

  # `--format helm` renders the same objects as `--format manifests`. Its own
  # job because it is the one check that needs the helm binary, and the offline
  # suite must not: a suite that skips when a tool is missing reports a clean
  # pass having tested nothing (the fastapi lesson, one job up).
  helm:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v5

      - run: pip install -e ".[dev]"

      - name: the chart lints on its own
        run: |
          helm lint --strict bzm_opl_gen/templates/helm \
              --set harborId=h --set shipId=s --set-string authToken=t

      - name: helm and manifests render the same objects
        run: python tests/helm_parity.py

  # `compose.yaml` is a file compose will actually take. Its own job for the
  # reason the helm one has: it needs a binary, and the offline suite must not
  # depend on one -- a suite that skips when a tool is missing reports a clean
  # pass having tested nothing.
  #
  # The pair with tests/test_generate.py is deliberate, and neither half covers
  # the other. That suite holds the compose file against the `docker run` beside
  # it -- same image, same environment, same mounts, same user, network, restart
  # policy, workdir and command (#178) -- and cannot know whether compose parses
  # either file: two python dicts agree perfectly about a document compose
  # refuses. This job parses it and knows nothing about the container it
  # describes.
  #
  # `docker compose version` first, because a runner without the plugin has to
  # fail here rather than somewhere that reads as a pass. ubuntu-latest carries
  # both; a self-hosted runner is where that could stop being true.
  docker:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The CLI is the whole of what this needs -- no test extras, and nothing
      # here imports the suite.
      - run: pip install -e .

      - run: docker compose version

      # The default shape: the credential split into bzm-opl-agent.env, which
      # compose reads through `env_file:`, and a proxy URL carrying a password.
      - name: the generated compose file is one compose accepts
        run: |
          python -m bzm_opl_gen generate --format docker \
              --facts examples/facts.example.json \
              --auth-token 0123456789abcdef0123456789abcdef \
              --proxy-http http://px:3128 --proxy-user u --proxy-pass 'p$ss w' \
              -o "$RUNNER_TEMP/docker"
          cd "$RUNNER_TEMP/docker" && docker compose config -q

      # The other branches of the file: the token inline (no env_file), the CA
      # bind mount with its `${CA_BUNDLE:-./ca-bundle.crt}` default, and an
      # image from a private registry.
      - name: ...in the branches the default one does not render
        run: |
          printf -- '-----BEGIN CERTIFICATE-----\nMIIfake\n-----END CERTIFICATE-----\n' \
              > "$RUNNER_TEMP/ca.pem"
          python -m bzm_opl_gen generate --format docker \
              --facts examples/facts.example.json \
              --auth-token 0123456789abcdef0123456789abcdef --no-secret \
              --ca-bundle "$RUNNER_TEMP/ca.pem" \
              --private-registry reg.example.com/bzm \
              -o "$RUNNER_TEMP/docker-inline"
          cd "$RUNNER_TEMP/docker-inline" && docker compose config -q

      # Service virtualization, which is two more bind mounts and three more
      # variables (#182). The certificate is generated here rather than checked
      # in, because generate() *parses* it -- the hostname is checked against
      # its SAN -- so a fixture that only looked like PEM would prove the
      # refusal path rather than this one.
      - name: ...and in the one that publishes virtual services
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
              -keyout "$RUNNER_TEMP/sv.key" -out "$RUNNER_TEMP/sv.crt" \
              -subj "/CN=mocks.example.com" \
              -addext "subjectAltName=DNS:mocks.example.com,DNS:*.mocks.example.com"
          python -m bzm_opl_gen generate --format docker \
              --facts examples/facts.example.json \
              --auth-token 0123456789abcdef0123456789abcdef \
              --sv-hostname mocks.example.com \
              --sv-tls-cert "$RUNNER_TEMP/sv.crt" \
              --sv-tls-key "$RUNNER_TEMP/sv.key" \
              -o "$RUNNER_TEMP/docker-sv"
          cd "$RUNNER_TEMP/docker-sv" && docker compose config -q
          # The pair reaches the container, at the paths BlazeMeter's own
          # command mounts them at.
          docker compose config | grep -q 'TLS_CERT: /etc/ssl/certs/public.pem'
          docker compose config | grep -q 'target: /etc/ssl/certs/privatekey.pem'

      # ...and the negative half. A required value left blank is written as
      # compose's own `${X:?message}` (#183), so `up -d` aborts before anything
      # is created. Accepting an unfinished bundle here would be compose
      # starting an agent the script beside it refuses -- the two routes
      # disagreeing about whether the bundle is finished.
      - name: a field left blank is refused by compose itself
        run: |
          python -m bzm_opl_gen generate --format docker \
              --facts examples/facts.example.json -o "$RUNNER_TEMP/docker-blank"
          cd "$RUNNER_TEMP/docker-blank"
          if docker compose config -q 2>"$RUNNER_TEMP/blank.err"; then
            echo "compose accepted a bundle with a blank AUTH_TOKEN" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/blank.err"
          grep -q 'BZM_OPL_UNSET_AUTH_TOKEN' "$RUNNER_TEMP/blank.err"

      # ...and the same for the identity, which is the state a bundle generated
      # before the BlazeMeter location exists is in: `facts --manual` with no ids
      # at all. The offline suite holds the wording of both guards; only compose
      # can say whether it refuses the file, which is the whole reason this job
      # exists. Every value here is supplied except the two ids, so a failure
      # naming AUTH_TOKEN would mean the identity guard never fired.
      - name: an identity nobody supplied is refused by compose itself
        run: |
          python -m bzm_opl_gen facts --manual -o "$RUNNER_TEMP/no-location.json"
          python -m bzm_opl_gen generate --format docker \
              --facts "$RUNNER_TEMP/no-location.json" \
              --auth-token 0123456789abcdef0123456789abcdef \
              -o "$RUNNER_TEMP/docker-no-location"
          cd "$RUNNER_TEMP/docker-no-location"
          if docker compose config -q 2>"$RUNNER_TEMP/ids.err"; then
            echo "compose accepted a bundle with no harbor id and no ship id" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/ids.err"
          grep -qE 'BZM_OPL_UNSET_(HARBOR|SHIP)_ID' "$RUNNER_TEMP/ids.err"

  # The web UI. Separate from the python job rather than bolted onto its
  # matrix: it shares no toolchain with it, and running it twice over two
  # python versions would say nothing new. The suite is the option-group
  # lifecycle -- plain data in, data out -- which is the part of the form that
  # used to drift silently between the fields and the wipe list.
  ui:
    runs-on: ${{ (github.event_name == 'pull_request' && !github.event.repository.private) && 'ubuntu-latest' || (vars.RUNNER_LABELS || 'ubuntu-latest') }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck
      - run: npm test
